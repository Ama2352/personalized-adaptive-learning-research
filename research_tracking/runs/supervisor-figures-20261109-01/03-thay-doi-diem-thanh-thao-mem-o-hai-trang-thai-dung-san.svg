<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 350" role="img" aria-label="Soft-mastery gain ở hai trạng thái dựng sẵn"><title>Thay đổi điểm thành thạo mềm ở hai trạng thái dựng sẵn</title><desc>Chỉ hai time readouts của states dựng sẵn; không native simulation.</desc><rect width="100%" height="100%" fill="white" /><text x="25" y="28" font-size="18" font-family="sans-serif" fill="#142c46">Thay đổi điểm thành thạo mềm ở hai trạng thái dựng sẵn</text><circle cx="220" cy="158.64200888571992" r="5" fill="#126f85" /><text x="232" y="158.64200888571992" font-size="14" font-family="monospace" fill="#126f85">A: 0.01182893</text><circle cx="620" cy="226.22406592362023" r="5" fill="#126f85" /><text x="632" y="214.22406592362023" font-size="14" font-family="monospace" fill="#126f85">A: 0.005502275</text><polyline points="220,158.64200888571992 620,226.22406592362023" fill="none" stroke="#126f85" stroke-width="2" /><circle cx="220" cy="101.66666666666669" r="5" fill="#a73539" /><text x="232" y="101.66666666666669" font-size="14" font-family="monospace" fill="#a73539">B: 0.01716264</text><circle cx="620" cy="230.30197349653858" r="5" fill="#a73539" /><text x="632" y="246.30197349653858" font-size="14" font-family="monospace" fill="#a73539">B: 0.005120524</text><polyline points="220,101.66666666666669 620,230.30197349653858" fill="none" stroke="#a73539" stroke-width="2" /><text x="220" y="310" font-size="14" font-family="sans-serif">T</text><text x="620" y="310" font-size="14" font-family="sans-serif">T + 14 ngày</text><text x="25" y="340" font-size="13" font-family="sans-serif">Điểm thành thạo mềm tại hai thời điểm; không phải quỹ đạo học đo được.</text></svg>