<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 210" role="img" aria-label="Phản ví dụ lộ trình A–B–A trên revision selector hiện có"><title>Phản ví dụ của quy tắc chọn bài: A → B → A</title><desc>Synthetic DAG và scripted mastery, không learning trajectory.</desc><rect width="100%" height="100%" fill="white" /><text x="25" y="28" font-size="18" font-family="sans-serif" fill="#142c46">Phản ví dụ của quy tắc chọn bài: A → B → A</text><rect x="30" y="80" width="270" height="55" rx="8" fill="#e8f2f5" /><text x="165" y="113" text-anchor="middle" font-family="sans-serif" font-size="14">A1 / chương A</text><text x="305" y="113" font-size="24">→</text><rect x="330" y="80" width="270" height="55" rx="8" fill="#e8f2f5" /><text x="465" y="113" text-anchor="middle" font-family="sans-serif" font-size="14">B1 / chương B</text><text x="605" y="113" font-size="24">→</text><rect x="630" y="80" width="270" height="55" rx="8" fill="#e8f2f5" /><text x="765" y="113" text-anchor="middle" font-family="sans-serif" font-size="14">A2 / chương A (quay lại)</text><text x="25" y="180" font-family="sans-serif" font-size="13">Cả hai quy tắc tạo lộ trình này trong kịch bản dựng sẵn; không đo tần suất quay lại.</text></svg>