<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 400" role="img" aria-labelledby="pool-key-title pool-key-desc"><title id="pool-key-title">Tập ứng viên cuối và khái niệm được chọn: hai đầu ra khác nhau</title><desc id="pool-key-desc">1080cặp tình huống. Tập cuối giữ và khái niệm giữ1007; tập giữ nhưng khái niệm đổi17; tập đổi nhưng khái niệm giữ51; cả hai đổi5. Tập cuối tái dựng từ nguồn; không phễu nhân quả.</desc><rect width="920" height="400" fill="white"/><g font-family="Segoe UI,Arial,sans-serif" fill="#17324d"><text x="30" y="35" font-size="21" font-weight="600">Sau lọc cân bằng, cùng tập chưa chắc cùng khái niệm thắng</text><text x="427" y="85" text-anchor="middle" font-size="17">Khái niệm giữ nguyên</text><text x="702" y="85" text-anchor="middle" font-size="17">Khái niệm thay đổi</text><text x="30" y="155" font-size="18">Tập ứng viên cuối giữ nguyên</text><text x="30" y="255" font-size="18">Tập ứng viên cuối thay đổi</text><rect x="300" y="115" width="255" height="85" rx="6" fill="#edf2f5"/><text x="427.5" y="168" text-anchor="middle" font-size="32" font-weight="600">1.007</text><rect x="575" y="115" width="255" height="85" rx="6" fill="#edf2f5"/><text x="702.5" y="168" text-anchor="middle" font-size="32" font-weight="600">17</text><rect x="300" y="215" width="255" height="85" rx="6" fill="#e3f0f1"/><text x="427.5" y="268" text-anchor="middle" font-size="32" font-weight="600">51</text><rect x="575" y="215" width="255" height="85" rx="6" fill="#e3f0f1"/><text x="702.5" y="268" text-anchor="middle" font-size="32" font-weight="600">5</text><text x="30" y="345" font-size="17">Cùng 1.080 tình huống, không thêm mẫu độc lập.</text><text x="30" y="378" font-size="16">Bốn ô mô tả lựa chọn thử trên trạng thái đã lưu, không phải lợi ích học tập.</text></g></svg>