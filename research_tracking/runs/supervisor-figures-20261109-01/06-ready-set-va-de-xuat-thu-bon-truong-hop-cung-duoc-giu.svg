<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 390" role="img" aria-labelledby="cross-ready-title cross-ready-desc"><title id="cross-ready-title">Ready set và đề xuất thử: bốn trường hợp cùng được giữ</title><desc id="cross-ready-desc">1080 snapshot pairs: Rgiữ/Agiữ1003;Rgiữ/Ađổi17;Rđổi/Agiữ55;Rđổi/Ađổi5. Không phễu nhân quả.</desc><rect width="920" height="390" fill="white"/><g font-family="Segoe UI,Arial,sans-serif" fill="#17324d"><text x="30" y="35" font-size="21" font-weight="600">Tập cho phép đổi chưa đủ làm đề xuất thử đổi</text><text x="415" y="85" text-anchor="middle" font-size="17">Đề xuất thử giữ nguyên</text><text x="705" y="85" text-anchor="middle" font-size="17">Đề xuất thử thay đổi</text><text x="30" y="165" font-size="18">Tập cho phép giữ nguyên</text><text x="30" y="265" font-size="18">Tập cho phép thay đổi</text><rect x="280" y="115" width="270" height="85" rx="6" fill="#edf2f5"/><text x="415" y="168" text-anchor="middle" font-size="32" font-weight="600">1.003</text><rect x="570" y="115" width="270" height="85" rx="6" fill="#edf2f5"/><text x="705" y="168" text-anchor="middle" font-size="32" font-weight="600">17</text><rect x="280" y="215" width="270" height="85" rx="6" fill="#e3f0f1"/><text x="415" y="268" text-anchor="middle" font-size="32" font-weight="600">55</text><rect x="570" y="215" width="270" height="85" rx="6" fill="#e3f0f1"/><text x="705" y="268" text-anchor="middle" font-size="32" font-weight="600">5</text><text x="30" y="345" font-size="17">Cùng 1.080 tình huống; đọc lại mẫu cũ, không tăng số mẫu độc lập.</text><text x="30" y="375" font-size="16">Bốn ô là đồng xuất hiện của thay đổi, không phải một chuỗi nguyên nhân.</text></g></svg>