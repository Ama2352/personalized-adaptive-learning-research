   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start" x="72" y="335.808" transform="rotate(-0 72 335.808)">Cùng4.136.906target có dự đoán;144OOV được báo riêng. CI95% bootstrap ghép cặp theo người học,2.000lượt.</text>
  </g>
  <g id="text_38">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start" x="72" y="356.796" transform="rotate(-0 72 356.796)">Giá trị âm ở hình phải ứng với Log Loss thấp hơn A0. CI là khoảng biên; Holm24 và giới hạn quy trình nằm trong báo cáo.</text>
